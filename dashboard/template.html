<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>re:Invent 2026 セッション</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #111214;
    --surface: #18191c;
    --surface-2: #202226;
    --line: #2b2d32;
    --text: #e6e7ea;
    --text-2: #a3a6ad;
    --text-3: #71757d;
    --accent: #6ea8fe;
    --accent-soft: rgba(110, 168, 254, 0.14);
    --star: #f2c14e;
    --sans: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Consolas", "Menlo", monospace;
    /* 強めの spring（行き過ぎて戻る）。操作への応答だけに使う */
    --spring: linear(0, 0.22 7%, 0.74 17%, 1.06 28%, 1.12 35%, 1.06 45%, 0.99 58%, 1.01 72%, 1);
    --spring-dur: 380ms;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    grid-template-areas: "top top" "list panel";
    gap: 16px;
    max-width: 1280px;
    margin: 0 auto;
    padding: 16px;
  }
  .top { grid-area: top; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .list { grid-area: list; min-width: 0; }
  .panel { grid-area: panel; align-self: start; position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }

  .search {
    flex: 1 1 320px; min-width: 0;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 12px; outline: none;
  }
  .search:focus { border-color: var(--accent); }
  .count { color: var(--text-2); white-space: nowrap; }
  .count b { color: var(--text); font-weight: 600; }
  .ctrl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .toggle, .seg button, .linkbtn {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 10px; cursor: pointer; color: var(--text-2);
  }
  .toggle[aria-pressed="true"], .seg button[aria-pressed="true"] { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; }
  .seg button:first-child { border-radius: 8px 0 0 8px; }
  .seg button:last-child { border-radius: 0 8px 8px 0; border-left: none; }

  /* 一覧 */
  .card { border-bottom: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 4px; padding: 10px 4px; }
  .star {
    width: 28px; height: 28px; border: none; background: none; cursor: pointer;
    color: var(--text-3); font-size: 18px; line-height: 28px; padding: 0; border-radius: 6px;
  }
  .star[aria-pressed="true"] { color: var(--star); }
  .star.pop { animation: pop var(--spring-dur) var(--spring); }
  @keyframes pop { from { transform: scale(0.6); } to { transform: scale(1); } }
  .head { cursor: pointer; min-width: 0; border: none; background: none; text-align: left; padding: 0; }
  .title { font-size: 15px; font-weight: 600; color: var(--text); }
  .meta { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--text-2); margin-top: 4px; }
  .meta .code { color: var(--text); }
  .detail { padding: 0 8px 14px 40px; color: var(--text-2); font-size: 13px; transform-origin: top; }
  .detail.enter { animation: open var(--spring-dur) var(--spring); }
  @keyframes open { from { opacity: 0; transform: translateY(-6px) scaleY(0.96); } to { opacity: 1; transform: none; } }
  .detail p { margin: 0 0 10px; color: var(--text); line-height: 1.65; }
  .detail dl { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 4px 12px; margin: 0; }
  .detail dt { color: var(--text-3); }
  .detail dd { margin: 0; }
  .empty { color: var(--text-3); padding: 40px 0; text-align: center; }
  .sentinel { height: 1px; }

  /* 絞り込みパネル */
  .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .panel-title { font-weight: 600; }
  .linkbtn { padding: 4px 8px; font-size: 12px; }
  .group { border-top: 1px solid var(--line); }
  .ghead { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 2px; border: none; background: none; cursor: pointer; text-align: left; }
  .ghead .chev { color: var(--text-3); transition: transform var(--spring-dur) var(--spring); }
  .group.open .ghead .chev { transform: rotate(90deg); }
  .ghead .gname { flex: 1; font-weight: 600; }
  .ghead .gsel { color: var(--accent); font-size: 12px; }
  .gbody { display: none; padding: 0 0 10px; }
  .group.open .gbody { display: block; }
  .gbody.enter { animation: open var(--spring-dur) var(--spring); }
  .gtools { display: flex; gap: 6px; margin-bottom: 6px; }
  .gsearch { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; outline: none; font-size: 12px; }
  .gsearch:focus { border-color: var(--accent); }
  .opts { max-height: 260px; overflow: auto; }
  .opt { display: flex; align-items: center; gap: 8px; padding: 3px 2px; cursor: pointer; border-radius: 4px; font-size: 13px; }
  .opt input { accent-color: var(--accent); margin: 0; flex: none; }
  .opt .olabel { flex: 1; min-width: 0; }
  .opt .ocount { color: var(--text-3); font-size: 12px; }
  .opt.zero { color: var(--text-3); }
  .opt input:checked { animation: pop var(--spring-dur) var(--spring); }
  .panel-toggle { display: none; }

  /* 画面切り替え（一覧 / 日程）。日程表示中は一覧専用の操作を隠す */
  .views button { min-height: 44px; padding: 7px 14px; }
  .schedule { display: none; grid-column: 1 / -1; min-width: 0; }
  body.is-schedule .search, body.is-schedule .count, body.is-schedule .ctrl,
  body.is-schedule .list, body.is-schedule .panel, body.is-schedule .dock { display: none; }
  body.is-schedule .schedule { display: block; }

  /* 一覧カード内の「☆との重複・移動」表示 */
  .clash { font-size: 12px; color: var(--star); margin-top: 3px; }

  /* ☆を付け外しした直後に出る、その日の☆件数と重複数 */
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; align-items: center; gap: 8px; padding: 4px 8px 4px 16px;
    background: var(--surface); border-top: 1px solid var(--line); font-size: 13px;
  }
  .dock.enter { animation: rise var(--spring-dur) var(--spring); }
  .dock .dmsg { flex: 1; min-width: 0; }
  .dock a { color: var(--accent); min-height: 44px; display: inline-flex; align-items: center; padding: 0 8px; white-space: nowrap; }
  .dock .close { width: 44px; height: 44px; border: none; background: none; cursor: pointer; color: var(--text-2); font-size: 18px; padding: 0; }
  body.has-dock .layout { padding-bottom: 72px; }
  @keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* 日程: 日付タブと時間割 */
  .days { display: flex; gap: 3px; margin-bottom: 8px; }
  .days button {
    flex: 1 1 0; min-width: 0; min-height: 44px; padding: 4px 0; white-space: nowrap;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    cursor: pointer; color: var(--text-2); line-height: 1.25; font-size: 12px; letter-spacing: -0.02em;
  }
  .days button .dw { display: block; font-size: 11px; color: var(--text-3); }
  .days button.nofav { color: var(--text-3); }
  .days button[aria-pressed="true"] { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }
  .tz { font-size: 12px; color: var(--text-3); margin: 0 0 12px; }
  .tt-wrap.enter { animation: open var(--spring-dur) var(--spring); transform-origin: top; }
  .tt { position: relative; margin: 8px 0 16px 40px; }
  .tt .hour { position: absolute; left: -40px; right: 0; border-top: 1px solid var(--line); }
  .tt .hour span { position: absolute; top: -8px; left: 0; width: 34px; font-size: 11px; color: var(--text-3); background: var(--bg); }
  .blk {
    position: absolute; overflow: hidden; text-align: left; cursor: pointer;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 6px; font-size: 12px; line-height: 1.35; color: var(--text-2);
  }
  .blk.mv-before { padding-bottom: 14px; }
  .blk.mv-after { padding-top: 14px; }
  .blk .bt { color: var(--text); font-weight: 600; font-size: 13px; }
  .blk .bm { display: flex; flex-wrap: wrap; gap: 0 8px; }
  .blk .bm .code { color: var(--text); }
  .blk .ovl { color: var(--star); }
  .mv {
    position: absolute; left: 0; right: 0; height: 20px; z-index: 2; pointer-events: none;
    display: flex; align-items: center; justify-content: center; padding: 0 4px;
    font-size: 11px; color: var(--star); background: var(--bg); border: 1px dashed var(--line); border-radius: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* 全日ビュー（週間）: 目盛り列は細く、5 日を等幅で並べる */
  .wk { display: flex; --lane: 56px; }
  .wk-gut { flex: none; width: 22px; padding-top: 52px; }
  .wk-gut-body { position: relative; margin-bottom: 16px; }
  .wk-gut-body span { position: absolute; left: 0; top: 0; margin-top: -8px; font-size: 10px; color: var(--text-3); }
  .wk-scroll { flex: 1; min-width: 0; overflow-x: auto; overscroll-behavior-x: contain; }
  .wk-head, .wk-body { display: grid; gap: 0 2px; width: max-content; min-width: 100%; }
  .wk-head { height: 44px; }
  .wk-head button {
    min-height: 44px; padding: 2px 0; border: none; background: none; cursor: pointer;
    color: var(--text-2); font-size: 12px; line-height: 1.25; white-space: nowrap;
  }
  .wk-head .dw { display: block; font-size: 11px; color: var(--text-3); }
  .wk-body { position: relative; margin: 8px 0 16px; }
  .wk-body .hour { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
  .wk-col { position: relative; min-width: 0; }
  .wblk {
    position: absolute; overflow: hidden; cursor: pointer; text-align: left; padding: 2px 3px;
    display: flex; flex-direction: column; font-size: 10px; line-height: 1.3; white-space: nowrap;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; color: var(--text);
  }
  .wblk .wt { color: var(--text-2); }
  .wblk.is-ovl { border-color: var(--star); }
  /* 移動の印は狭い（重なりで分割された）ブロックでも見えるよう右下に固定する */
  .wblk .wm { position: absolute; right: 2px; bottom: 1px; color: var(--star); background: var(--surface-2); }
  .wk-tbd { font-size: 13px; color: var(--text-2); display: flex; flex-wrap: wrap; align-items: center; gap: 0 4px; }
  .wk-tbd button { min-height: 44px; padding: 0 6px; border: none; background: none; cursor: pointer; color: var(--text); text-decoration: underline dotted; text-underline-offset: 3px; }
  .tbd .blk { position: static; display: block; width: 100%; min-height: 44px; margin-bottom: 6px; }

  /* 日程の詳細（下から出るシート） */
  .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); z-index: 10; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-height: 70vh; overflow: auto;
    background: var(--surface); border-top: 1px solid var(--line); border-radius: 12px 12px 0 0;
    max-width: 720px; margin: 0 auto; padding: 8px 8px 16px;
  }
  .sheet.enter { animation: rise var(--spring-dur) var(--spring); }
  .sheet .shead { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 4px; align-items: start; }
  .sheet .star, .sheet .close { width: 44px; height: 44px; line-height: 44px; font-size: 20px; }
  .sheet .close { border: none; background: none; cursor: pointer; color: var(--text-2); border-radius: 6px; padding: 0; }
  .sheet .stitle { padding-top: 10px; min-width: 0; }
  .sheet .detail { padding: 8px 4px 0; }

  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  @media (max-width: 860px) {
    .layout { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "panel" "list"; }
    .panel { position: static; max-height: none; }
    .panel-toggle { display: inline-block; }
    .panel.collapsed .groups, .panel.collapsed .panel-head .linkbtn.clear-all { display: none; }
    .detail { padding-left: 8px; }
    .detail dl { grid-template-columns: 64px minmax(0, 1fr); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="layout">
  <header class="top">
    <div class="seg views" role="group" aria-label="画面">
      <button type="button" data-view="list" aria-pressed="true">一覧</button>
      <button type="button" data-view="schedule" aria-pressed="false">日程</button>
    </div>
    <input id="q" class="search" type="search" placeholder="キーワード（タイトル・概要・コード・登壇者）" autocomplete="off">
    <span class="count"><b id="hits" class="mono">0</b> 件</span>
    <div class="ctrl">
      <button id="starOnly" class="toggle" type="button" aria-pressed="false">☆のみ</button>
      <div class="seg" role="group" aria-label="並び順">
        <button type="button" data-sort="time" aria-pressed="true">日時順</button>
        <button type="button" data-sort="code" aria-pressed="false">コード順</button>
      </div>
    </div>
  </header>

  <main class="list" id="list"></main>

  <aside class="panel collapsed" id="panel">
    <div class="panel-head">
      <span class="panel-title">絞り込み</span>
      <span>
        <button type="button" class="linkbtn clear-all" id="clearAll">すべてクリア</button>
        <button type="button" class="linkbtn panel-toggle" id="panelToggle" aria-expanded="false">開く</button>
      </span>
    </div>
    <div class="groups" id="groups"></div>
  </aside>

  <section class="schedule" id="schedule" aria-label="日程">
    <div class="days" id="days" role="group" aria-label="日付"></div>
    <p class="tz">時刻はラスベガス現地時間のまま表示しています（日本時間に変換していません）</p>
    <div id="tt"></div>
  </section>
</div>
<div class="dock" id="dock" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-label="セッションの詳細" hidden></div>

<script id="data" type="application/json">/*__DATA__*/</script>
<script>
(function () {
  "use strict";

  // ---- データ読み込み ----
  var DATA = JSON.parse(document.getElementById("data").textContent);
  var SESSIONS = DATA.sessions || [];
  function speakerNames(s) { return arr(s.speakers).map(function (p) { return p && p.name; }).filter(Boolean); }
  var WEEK = ["日", "月", "火", "水", "木", "金", "土"];
  var PAGE = 150; // 一度に描画する件数

  function arr(v) { return v == null || v === "" ? [] : (Array.isArray(v) ? v : [v]); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fmtDate(d) {
    if (!d) return "日時未定";
    var p = d.split("-");
    if (p.length !== 3) return d;
    var w = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay();
    return (+p[1]) + "/" + (+p[2]) + "(" + WEEK[w] + ")";
  }
  function dateOf(s) { return (s.sessionTime && s.sessionTime.date) || ""; }

  // ---- 時刻の重なりと会場移動（一覧と日程で共有する判定） ----
  var MOVE_LIMIT = 30; // 会場が違うとき、前の終了から次の開始までがこれ未満（分）なら移動を注意する
  // sessionTime から当日の開始・終了（0 時からの分）を返す。日時未定なら null
  function spanOf(s) {
    var t = s.sessionTime || {};
    var m = /^(\d{1,2}):(\d{2})$/.exec(t.time || "");
    if (!t.date || !m) return null;
    var start = (+m[1]) * 60 + (+m[2]);
    return { date: t.date, start: start, end: start + (Number(t.length) || 0) };
  }
  function hhmm(min) { var h = Math.floor(min / 60), m = min % 60; return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m; }
  function rangeText(sp) { return sp.end > sp.start ? hhmm(sp.start) + "–" + hhmm(sp.end) : hhmm(sp.start); }
  // 同じ日で時間が重なるか。長さ 0 分のものも開始時刻の一点として重なりに数える
  function overlaps(a, b) {
    var x = spanOf(a), y = spanOf(b);
    if (!x || !y || x.date !== y.date) return false;
    return x.start < Math.max(y.end, y.start + 1) && y.start < Math.max(x.end, x.start + 1);
  }
  // 時刻順で a → b と続くとき、会場が違い間隔が MOVE_LIMIT 分未満なら { gap, from, to } を返す
  // 重なっている（間隔が負）場合は重なりとして扱うので、ここでは返さない
  function moveBetween(a, b) {
    var x = spanOf(a), y = spanOf(b);
    if (!x || !y || x.date !== y.date || !a.venueName || !b.venueName || a.venueName === b.venueName) return null;
    var gap = y.start - x.end;
    return gap >= 0 && gap < MOVE_LIMIT ? { gap: gap, from: a.venueName, to: b.venueName } : null;
  }
  // 時刻順に並べる（開始 → 終了 → コード）
  function byStart(a, b) {
    var x = spanOf(a), y = spanOf(b);
    return x.start - y.start || x.end - y.end || (a._code < b._code ? -1 : a._code > b._code ? 1 : 0);
  }
  function favList() { return Array.from(favs).map(function (id) { return BY_ID[id]; }).filter(Boolean); }
  // その日（"" は日時未定）の☆の件数と、重なっている組の数
  function daySummary(date) {
    var list = favList().filter(function (s) { return dateOf(s) === date; });
    var pairs = 0;
    for (var i = 0; i < list.length; i++) for (var j = i + 1; j < list.length; j++) if (overlaps(list[i], list[j])) pairs++;
    return { count: list.length, overlaps: pairs };
  }

  // ---- お気に入り（localStorage が使えなくても動く） ----
  var FAV_KEY = "reinvent2026.favorites";
  var favs = new Set();
  try {
    var raw = localStorage.getItem(FAV_KEY);
    if (raw) JSON.parse(raw).forEach(function (id) { favs.add(id); });
  } catch (e) { /* 保存領域が使えない環境では記憶しないだけ */ }
  function saveLocal() {
    try { localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(favs))); } catch (e) { /* 同上 */ }
  }
  // ☆を付け外ししたときは、この端末だけに保存する
  function saveFavs() {
    saveLocal();
  }

  // ---- 絞り込み項目の定義 ----
  var GROUPS = [
    { key: "topics", name: "トピック" },
    { key: "level", name: "レベル", sortByValue: true },
    { key: "type", name: "種別" },
    { key: "date", name: "日付", sortByValue: true, get: function (s) { return [dateOf(s)]; }, label: fmtDate },
    { key: "features", name: "形式" },
    { key: "areasOfInterest", name: "関心領域" },
    { key: "industries", name: "業界" },
    { key: "roles", name: "職種" },
    { key: "venue", name: "会場", get: function (s) { return arr(s.venueName); } },
    { key: "services", name: "サービス", searchable: true, label: function (v) { return v; } },
    // 登壇者は 2,000 人超なので、該当 0 の人を隠し、検索していないときは上位 100 人だけ出す
    { key: "speakers", name: "登壇者", searchable: true, placeholder: "名前で探す", hideZero: true, limit: 100,
      get: speakerNames, label: function (v) { return v; } }
  ];
  GROUPS.forEach(function (g) {
    if (!g.get) g.get = function (s) { return arr(s[g.key]); };
    if (!g.label) g.label = function (v) { return String(v); };
    g.selected = new Set();
    // よく使う項目は最初から開いておく
    g.open = ["topics", "level", "type", "date"].indexOf(g.key) >= 0;
    g.query = "";
    // 選択肢の一覧（全件ベースで固定）
    var all = new Set();
    SESSIONS.forEach(function (s) { g.get(s).forEach(function (v) { all.add(v); }); });
    g.values = Array.from(all);
    if (g.sortByValue) {
      // 日付は未定を末尾に
      g.values.sort(function (a, b) { return (a === "") - (b === "") || (a < b ? -1 : a > b ? 1 : 0); });
    }
  });

  // ---- 検索用の前処理 ----
  var BY_ID = {};
  SESSIONS.forEach(function (s, i) {
    s._i = i;
    BY_ID[s.sessionId] = s;
    s._text = [s.title, s.abstract, s.abbreviation, speakerNames(s).join(" ")].join("\n").toLowerCase();

        }).join("") + "</div>";
      }).join("");
      html += '<div class="wk-body" style="grid-template-columns:' + tmpl + ";height:" + ((hi - lo) * PX_W) + 'px">' + hours + cols + "</div>";
      gut = '<div class="wk-gut-body" style="height:' + ((hi - lo) * PX_W) + 'px">' + gut + "</div>";
    }
    // 時刻の目盛り列は固定し、日付見出しと時間割だけが横にスクロールする（収まるときはスクロールしない）
    html = '<div class="wk"><div class="wk-gut">' + gut + '</div><div class="wk-scroll">' + html + "</div></div>";
    if (undated.length) {
      html += '<div class="wk-tbd">日時未定の☆ ' + undated.length + " 件: " + undated.map(function (s) {
        return '<button type="button" class="mono" data-id="' + esc(s.sessionId) + '">' + esc(s.abbreviation || "—") + "</button>";
      }).join("") + "</div>";
    }
    return html;
  }
  function timetableHtml(list) {
    var items = layoutItems(list, PX);
    var lo = Math.floor(items[0].sp.start / 60) * 60;
    var hi = Math.ceil(Math.max.apply(null, items.map(function (it) { return it.vend; })) / 60) * 60;
    // 会場移動の注意は、時刻順で連続する 2 件の間に置く
    var moves = "";
    for (var i = 0; i + 1 < items.length; i++) {
      var mv = moveBetween(items[i].s, items[i + 1].s);
      if (!mv) continue;
      items[i].cls += " mv-before";
      items[i + 1].cls += " mv-after";
      var mid = (items[i].sp.end + items[i + 1].sp.start) / 2;
      moves += '<div class="mv" style="top:' + ((mid - lo) * PX - 10).toFixed(1) + 'px">会場移動 ' + mv.gap + " 分（" + esc(mv.from) + " → " + esc(mv.to) + "）</div>";
    }
    var hours = "";
    for (var h = lo; h <= hi; h += 60) hours += '<div class="hour" style="top:' + ((h - lo) * PX) + 'px"><span class="mono">' + hhmm(h) + "</span></div>";
    var blocks = items.map(function (it) {
      var ovl = list.some(function (o) { return o !== it.s && overlaps(it.s, o); });
      var style = "top:" + ((it.sp.start - lo) * PX).toFixed(1) + "px;height:" + Math.max((it.sp.end - it.sp.start) * PX - 2, MIN_H).toFixed(1) + "px;" +
        "left:" + (it.col * 100 / it.n).toFixed(3) + "%;width:calc(" + (100 / it.n).toFixed(3) + "% - 4px)";
      return blockHtml(it.s, ovl, it.cls, style);
    }).join("");
    return '<div class="tt" style="height:' + ((hi - lo) * PX) + 'px">' + hours + blocks + moves + "</div>";
  }

  // 詳細シート。☆を外すと時間割からすぐ消える（シートは開いたままなので付け直せる）
  var sheetEl = document.getElementById("sheet");
  var scrimEl = document.getElementById("scrim");
  var sheetId = null;
  function openSheet(id) {
    var s = BY_ID[id];
    if (!s) return;
    sheetId = id;
    var fav = favs.has(id);
    sheetEl.innerHTML = '<div class="shead">' +
      '<button type="button" class="star" aria-label="お気に入り" aria-pressed="' + fav + '">' + (fav ? "★" : "☆") + "</button>" +
      '<div class="stitle"><div class="title" lang="en">' + esc(s.title) + "</div>" +
      '<div class="meta">' + metaHtml(s) + "</div></div>" +
      '<button type="button" class="close" aria-label="閉じる">×</button></div>' + detailHtml(s).replace(" enter", "");
    sheetEl.hidden = false;
    scrimEl.hidden = false;
    sheetEl.classList.remove("enter"); void sheetEl.offsetWidth; sheetEl.classList.add("enter");
    sheetEl.scrollTop = 0;
  }
  function closeSheet() { sheetEl.hidden = true; scrimEl.hidden = true; sheetId = null; }
  sheetEl.addEventListener("click", function (e) {
    if (e.target.closest(".close")) { closeSheet(); return; }
    var star = e.target.closest(".star");
    if (!star || !sheetId) return;
    if (favs.has(sheetId)) favs.delete(sheetId); else favs.add(sheetId);
    saveFavs();
    var on = favs.has(sheetId);
    star.setAttribute("aria-pressed", on);
    star.textContent = on ? "★" : "☆";
    star.classList.remove("pop"); void star.offsetWidth; star.classList.add("pop");
    renderDays();
    renderTimetable(false);
  });
  scrimEl.addEventListener("click", closeSheet);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && sheetId) closeSheet(); });
  daysEl.addEventListener("click", function (e) {
    var b = e.target.closest("[data-day]");
    if (!b) return;
    schedDay = b.getAttribute("data-day");
    renderDays();
    renderTimetable(true);
  });
  ttEl.addEventListener("click", function (e) {
    var d = e.target.closest(".wk-head [data-day]");
    if (d) { schedDay = d.getAttribute("data-day"); renderDays(); renderTimetable(true); return; } // 列見出しからその日のタブへ
    var b = e.target.closest("[data-id]");
    if (b) openSheet(b.getAttribute("data-id"));
  });

  // ---- 画面の切り替え（#list / #schedule）。描画は hashchange の一か所に集める ----
  var view = null;
  var viewBtns = document.querySelectorAll("[data-view]");
  viewBtns.forEach(function (b) {
    b.addEventListener("click", function () { location.hash = "#" + b.getAttribute("data-view"); });
  });
  function applyView() {
    var next = location.hash === "#schedule" ? "schedule" : "list";
    if (next === view) return;
    var first = view === null;
    view = next;
    document.body.classList.toggle("is-schedule", view === "schedule");
    viewBtns.forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-view") === view); });
    if (view === "schedule") {
      hideDock();
      schedDay = pendingDay != null && DAYS.indexOf(pendingDay) >= 0 ? pendingDay : ALL;
      pendingDay = null;
      renderDays();
      renderTimetable(!first);
      window.scrollTo(0, 0);
    } else {
      closeSheet();
      // 日程側で☆を外した分を一覧のカードにも反映する（初回は下の update で描画済み）
      if (!first) update(false);
    }
  }
  window.addEventListener("hashchange", applyView);

  update(false);
  applyView();
})();
</script>
</body>
</html>
